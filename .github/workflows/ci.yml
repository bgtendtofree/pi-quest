# Managed by pi-ci-standard — regenerate with: pi-ci init
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: jdx/mise-action@v4

      - name: Run CI gate
        run: mise run ci
